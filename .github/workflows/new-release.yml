---
name: Publish new release to npmjs
permissions:
  contents: read
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: npm run validate-release

      - name: Verify package
        run: npm run verify

      - name: Check package contents
        run: npm pack --dry-run

  publish:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node Engine
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/

      - name: Install staged publishing CLI
        run: npm install --global npm@11.15.0

      - name: Install Node dependencies
        run: npm ci

      - name: Stage package for npm approval
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
